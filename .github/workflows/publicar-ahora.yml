# Publica en Instagram, al momento, solo las series elegidas (p. ej. si una falló por la mañana).
# Genera de nuevo esas series con los datos actuales de AEMET y las publica ya.
name: Publicar ahora

on:
  workflow_dispatch:
    inputs:
      series:
        description: "Series separadas por coma: max, min, rain, wind, avisos"
        required: true
        default: avisos
      story:
        description: "Formato de la story"
        type: choice
        default: video
        options: [video, imagen]

concurrency:
  group: diario
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Madrid
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

      - name: Generar
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          SERIES: ${{ inputs.series }}
        run: python run.py --series "$SERIES"

      - name: Subir las imágenes (JPEG)
        run: |
          python publish.py jpeg
          cd media
          git init -q -b media
          git config user.name "hoymeteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Imágenes $(date +%F) (publicar ahora)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          first=$(find . -name 'slide_1.jpg' | head -1 | sed 's|^\./||')
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$MEDIA_BASE_URL/$first")
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "Imagen pública: $MEDIA_BASE_URL/$first -> HTTP $code"
          [ "$code" = 200 ]

      - name: Publicar en Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          SERIES: ${{ inputs.series }}
          STORY_IMAGEN: ${{ inputs.story == 'imagen' && '1' || '0' }}
        run: python publish.py run --mode publish --series "$SERIES"
