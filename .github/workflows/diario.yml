# Ejecución diaria de @hoymeteo en GitHub Actions (gratis en repositorios públicos).
#
# El cron va en UTC y GitHub puede retrasarlo (el 10-nov-2026 arrancó 48 min tarde). Por eso se
# lanza muy pronto (02:47 UTC = 03:47 en invierno / 04:47 en verano) y wait_until.py espera
# hasta las 06:15 de Madrid.
# Si algo falla, GitHub envía un correo automáticamente al dueño del repositorio.
name: Publicación diaria

on:
  schedule:
    - cron: "47 2 * * *"
  workflow_dispatch:        # botón "Run workflow" para lanzarlo a mano
    inputs:
      instagram:
        description: "Qué hacer en Instagram"
        type: choice
        default: comprobar
        options: [nada, comprobar, preparar, publicar]

concurrency:
  group: diario
  cancel-in-progress: false

permissions:
  contents: write           # history/ en main y las imágenes en la rama "media"

jobs:
  generar:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Europe/Madrid
      MEDIA_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/media
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Pruebas
        run: python -m pytest -q

      - name: Qué hacer hoy en Instagram
        id: modo
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            modo=$(python -c "import config; print('publicar' if config.INSTAGRAM_AUTOPUBLISH else 'preparar')")
          else
            modo="${{ inputs.instagram }}"
          fi
          echo "instagram=$modo" >> "$GITHUB_OUTPUT"
          echo "Instagram: $modo"

      - name: Comprobar la cuenta de Instagram
        if: steps.modo.outputs.instagram != 'nada'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python publish.py check

      - name: Catálogo de municipios en caché
        uses: actions/cache@v4
        with:
          path: cache/maestro_municipios.json
          key: maestro-${{ github.run_id }}
          restore-keys: maestro-

      - name: Esperar a las 06:15 de Madrid
        if: github.event_name == 'schedule'
        run: python wait_until.py 06:15

      - name: Generar imágenes y textos
        if: steps.modo.outputs.instagram != 'comprobar'
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
        run: python run.py

      - name: Guardar el material del día
        if: steps.modo.outputs.instagram != 'comprobar'
        uses: actions/upload-artifact@v4
        with:
          name: hoymeteo-${{ github.run_id }}
          path: output/
          retention-days: 14

      # Guardar el histórico sirve para "hoy vs ayer" y además mantiene el repositorio
      # activo: GitHub desactiva los cron de repos sin actividad durante 60 días.
      - name: Guardar histórico
        if: steps.modo.outputs.instagram != 'comprobar'
        run: |
          git config user.name "hoymeteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "Histórico $(date +%F)"
          # Si alguien ha subido cambios mientras tanto, se integran antes de subir
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break; sleep 5; done

      # Instagram descarga las imágenes desde una URL pública. Se suben a la rama "media",
      # que se reescribe cada día solo con las de hoy (las anteriores desaparecen).
      - name: Subir las imágenes del día (JPEG)
        if: steps.modo.outputs.instagram == 'preparar' || steps.modo.outputs.instagram == 'publicar'
        run: |
          python publish.py jpeg
          cd media
          git init -q -b media
          git config user.name "hoymeteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -qm "Imágenes $(date +%F)"
          git push -fq "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" media
          first=$(find . -name 'slide_1.jpg' | head -1 | sed 's|^\./||')
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$MEDIA_BASE_URL/$first")
            [ "$code" = 200 ] && break
            sleep 10
          done
          echo "Imagen pública: $MEDIA_BASE_URL/$first -> HTTP $code"
          [ "$code" = 200 ]

      - name: Instagram (${{ steps.modo.outputs.instagram }})
        if: steps.modo.outputs.instagram == 'preparar' || steps.modo.outputs.instagram == 'publicar'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          if [ "${{ steps.modo.outputs.instagram }}" = "publicar" ]; then
            python publish.py run --mode publish
          else
            python publish.py run --mode prepare
          fi
