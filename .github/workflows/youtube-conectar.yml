# Conecta el canal de YouTube @hoymeteo (una sola vez). El código lo da la página
# https://hoymeteo-debug.github.io/hoymeteo/youtube/ tras autorizar en Google; caduca en minutos.
name: "YouTube: conectar"

on:
  workflow_dispatch:
    inputs:
      code:
        description: "Código de autorización (lo muestra la web al volver de Google)"
        required: true

permissions:
  contents: write

jobs:
  conectar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Cambiar el código por la autorización
        env:
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          CODE: ${{ inputs.code }}
        run: python youtube_cli.py connect --code "$CODE"
      - name: Guardar la autorización cifrada
        run: |
          git config user.name "hoymeteo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add youtube_state.enc
          git commit -m "YouTube conectado"
          git pull -q --rebase origin main
          git push
